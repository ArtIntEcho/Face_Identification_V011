[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "face-access"
version = "0.1.0"
description = "Local face authentication access-control prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mediapipe==0.10.21",
    "numpy==1.26.4",
    "onnxruntime==1.22.1",
    "opencv-contrib-python==4.11.0.86",
    "protobuf>=4.25.3,<5",
    "python-multipart==0.0.20",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
export = ["onnx==1.18.0", "torch==2.7.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["face_access*"]
